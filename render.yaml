services:
  - type: web
    runtime: docker
    name: AlphaDench
    region: frankfurt
    plan: pro
    healthCheckPath: /health
    envVars:
      - key: SETUP_PASSWORD
        sync: false
      - key: COMPOSIO_API_KEY
        sync: false
      - key: HUBSPOT_OAUTH_CLIENT_ID
        sync: false
      - key: HUBSPOT_OAUTH_CLIENT_SECRET
        sync: false
      - key: OPENCLAW_GATEWAY_TOKEN
        generateValue: true
      - key: WEBHOOK_TOKEN
        generateValue: true
      - key: PORT
        value: 3000
      - key: ALPHACLAW_CLAW_RUNTIME
        value: denchclaw
      - key: ALPHACLAW_GATEWAY_PORT
        value: 19001
      - key: DENCHCLAW_DAEMONLESS
        value: 1
      - key: DENCHCLAW_WEB_PORT
        value: 3100
      # Public origin used to construct OAuth callback URLs (e.g. Composio).
      # AlphaClaw's proxy doesn't forward X-Forwarded-Host to the DenchClaw
      # web runtime, so without this env var the callback URL resolves to
      # http://127.0.0.1:3100 — fine for local dev, broken in production.
      # sync:false so each deployment fills in its own onrender.com URL.
      - key: DENCHCLAW_PUBLIC_URL
        sync: false
    disk:
      name: openclaw-data
      mountPath: /data
      sizeGB: 10
